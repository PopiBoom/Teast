<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Memento Mori · OFF. KAPUSTKA</title>
<style>
@font-face{font-family:"Unbounded";src:url(fonts/Unbounded.ttf) format("truetype");font-weight:200 900;}
@font-face{font-family:"Oswald";src:url(fonts/Oswald.ttf) format("truetype");font-weight:200 700;}
@font-face{font-family:"Onest";src:url(fonts/Onest.ttf) format("truetype");font-weight:100 900;}
@font-face{font-family:"Cormorant";src:url(fonts/CormorantGaramond-Italic.ttf) format("truetype");font-weight:300 700;font-style:italic;}
html,body{margin:0;background:#000;overflow:hidden}#stage{display:block}
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>
/* ===========================================================================
   Memento Mori · OFF. KAPUSTKA — кинетическая типографика v3
   Идея: дни жизни = сообщения в Telegram. ~30 000 непрочитанных, мы их листаем.
   Один цвет — СЕГОДНЯ (фирменный красный канала). Сетка 100 BPM (доля 0.6 c).
   renderAt(t) — чистая функция времени.
   =========================================================================== */
const W=1920,H=1080,FPS=60,B=0.6,TOTAL=37.8;
const cv=document.getElementById('stage');
const ctx=cv.getContext('2d',{alpha:false});

/* ---------- утилиты ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,p)=>a+(b-a)*p;
const smooth=(a,b,x)=>{const p=clamp((x-a)/(b-a),0,1);return p*p*(3-2*p);};
const eOutCubic=p=>1-Math.pow(1-p,3);
const eOutQuint=p=>1-Math.pow(1-p,5);
const eInCubic=p=>p*p*p;
const eInOut=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eOutBack=p=>{const c1=1.55,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
const drift=(t,f,ph)=>Math.sin(t*f+ph);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashF(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function kf(t,arr){for(let i=0;i<arr.length-1;i++){if(t<=arr[i+1][0]){const d=arr[i+1][0]-arr[i][0];const p=d<=0?1:clamp((t-arr[i][0])/d,0,1);return lerp(arr[i][1],arr[i+1][1],eInOut(p));}}return arr[arr.length-1][1];}

/* ---------- палитра / шрифты ---------- */
const BONE='#ece7df',ASH='#8b8780',ASH_D='#5a5751',UI='#1a1e27',UI_B='rgba(255,255,255,0.07)';
const RED='#e3403b',RED_HI='#ff7a6e',RED_LO='#b3221f';
const FONT={
  wide:(s,w=800)=>`${w} ${s}px "Unbounded"`,          // широкий удар
  cond:(s,w=700)=>`${w} ${s}px "Oswald"`,             // узкий высокий (как на обложке)
  ui:(s,w=500)=>`${w} ${s}px "Onest"`,                // интерфейс / шёпот
  serif:(s,w=600)=>`italic ${w} ${s}px "Cormorant"`,  // голос автора
  mono:s=>`500 ${s}px "JetBrains Mono","DejaVu Sans Mono",monospace`,
  emoji:s=>`${s}px "Noto Color Emoji"`,
};
const warmth=t=>smooth(19.2,20.4,t)*0.85;
function bgColor(t){const w=warmth(t),c=[10,12,17],h=[22,13,12];
  return `rgb(${Math.round(lerp(c[0],h[0],w))},${Math.round(lerp(c[1],h[1],w))},${Math.round(lerp(c[2],h[2],w))})`;}

/* ===========================================================================
   Камера (псевдо-3D)
   =========================================================================== */
const F=1000;
function cameraAt(t){
  const cz=kf(t,[[0,-1150],[2.4,-1000],[9.6,-1040],[15.9,-900],[16.4,-1000],[19.2,-1000],[19.6,-955],[21.6,-1000],[25.8,-1000],[31.2,-1012],[34.2,-1030],[37.8,-985]]);
  let roll=kf(t,[[0,0],[5.3,0],[5.45,-0.9],[6.2,0],[9.6,0],[14.35,1.2],[14.5,-1.6],[15.4,1.8],[15.9,2.2],[16.6,0],[19.2,0],[19.3,0.9],[20.2,0],[23.9,0],[24.05,-0.7],[24.8,0],
    [26.3,0],[26.45,-0.9],[27.2,0],[29.35,0],[29.45,0.7],[30.2,0],[37.8,0]]);
  roll+=0.22*drift(t,0.31,0.6);
  const orbit=smooth(9.6,10.6,t)*(1-smooth(15.6,16.2,t));
  const cx=20*drift(t,0.41,0.3)+14*drift(t,0.19,2.2)+80*orbit*Math.sin((t-9.6)*0.55);
  const cy=10*drift(t,0.33,1.1)+40*orbit*Math.sin((t-9.6)*0.37+1);
  return {cx,cy,cz,roll:roll*Math.PI/180};
}
function project(x,y,z,cam){const dz=z-cam.cz,s=F/dz;return {x:W/2+(x-cam.cx)*s,y:H/2+(y-cam.cy)*s,s};}

/* ===========================================================================
   Текст
   =========================================================================== */
function setFont(font,ls){ctx.font=font;ctx.letterSpacing=(ls||0)+'px';}
function textW(text,font,ls){setFont(font,ls);return ctx.measureText(text).width-(ls||0);}
function liveGradient(size){const g=ctx.createLinearGradient(0,-size*0.55,0,size*0.55);
  g.addColorStop(0,RED_HI);g.addColorStop(0.5,RED);g.addColorStop(1,RED_LO);return g;}
function drawText(text,sx,sy,o){
  const alpha=o.alpha==null?1:o.alpha;if(alpha<=0.003)return;
  const size=o.size,ls=o.ls||0;
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(sx,sy);
  if(o.rot)ctx.rotate(o.rot);
  ctx.scale(o.s||1,(o.s||1)*(o.vs||1));
  setFont(o.font,ls);ctx.textBaseline='middle';ctx.textAlign='left';
  const w=ctx.measureText(text).width-ls;
  const x0=o.align==='left'?0:-w/2;
  if(o.mask){const m=o.mask,pad=size*0.25;ctx.beginPath();
    if(m.type==='up')ctx.rect(x0-pad,-size*0.72,w+pad*2,size*1.44);
    else ctx.rect(x0-pad,-size,(w+pad*2)*clamp(m.p,0,1),size*2);
    ctx.clip();}
  const dy=o.mask&&o.mask.type==='up'?(1-eOutQuint(clamp(o.mask.p,0,1)))*size*1.15:0;
  if(o.color==='live'){
    const glow=o.glow||0;
    if(glow>0){ctx.save();ctx.globalCompositeOperation='lighter';
      ctx.shadowColor=`rgba(232,64,58,${0.85*glow})`;ctx.shadowBlur=size*0.22*glow;
      ctx.fillStyle=`rgba(232,64,58,${0.3*glow})`;ctx.fillText(text,x0,dy);
      ctx.shadowBlur=size*0.5*glow;ctx.fillStyle=`rgba(200,30,30,${0.2*glow})`;ctx.fillText(text,x0,dy);
      ctx.restore();}
    if(o.ca>0){ctx.save();ctx.globalCompositeOperation='lighter';
      ctx.fillStyle='rgba(255,60,60,0.45)';ctx.fillText(text,x0-o.ca,dy);
      ctx.fillStyle='rgba(60,140,255,0.4)';ctx.fillText(text,x0+o.ca,dy);ctx.restore();}
    ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=size*0.03;ctx.shadowOffsetY=size*0.015;
    ctx.fillStyle=liveGradient(size);ctx.fillText(text,x0,dy);
  }else{
    if(o.shadow!==false){ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=size*0.06;ctx.shadowOffsetY=size*0.02;}
    ctx.fillStyle=o.color||BONE;ctx.fillText(text,x0,dy);
  }
  ctx.restore();
}
// строка из двух частей: вторая — тем же красным (ключевое слово)
function drawTwoTone(t,a1,a2,y,size,inT,outT,outDur){
  if(t<inT||t>outT+outDur)return;
  const r=clamp((t-inT)/0.5,0,1),cam=cameraAt(t);
  const a=smooth(0,.7,r)*(1-smooth(outT,outT+outDur,t));
  const p=project(0,y+(1-eOutCubic(r))*50,0,cam),f=FONT.serif(size);
  const w1=textW(a1,f,0),w2=textW(a2,f,0),x0=-(w1+w2)/2;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(cam.roll);ctx.scale(p.s,p.s);
  drawText(a1,x0,0,{font:f,size,color:ASH,align:'left',alpha:a});
  drawText(a2,x0+w1,0,{font:f,size,color:'live',align:'left',alpha:a,glow:0.45});
  ctx.restore();
}

/* ===========================================================================
   Cue-система для слов (состояния — чистые функции t, для motion blur)
   =========================================================================== */
function C(o){o.z=o.z||0;o.inDur=o.inDur??.4;o.hold=o.hold??.6;o.outDur=o.outDur??.35;
  o.t1=o.t0+o.inDur;o.t2s=o.t1+o.hold;o.t2=o.t2s+o.outDur;o.rot=o.rot||0;return o;}
function cueState(c,t){
  if(t<c.t0||t>c.t2)return null;
  const cam=cameraAt(t),p=project(c.x||0,c.y||0,c.z,cam);
  let dx=0,dy=0,sm=1,rot=cam.roll+c.rot*Math.PI/180,vs=1,alpha=1,mask=null;
  if(t<c.t1){const r=(t-c.t0)/c.inDur;
    switch(c.in){
      case 'maskUp':mask={type:'up',p:r};break;
      case 'mask':mask={type:'lr',p:eInOut(r)};break;
      case 'slide':dx=(1-eOutQuint(r))*(c.sdx||-260);alpha=smooth(0,.45,r);break;
      case 'scaleBack':sm=lerp(.15,1,eOutBack(r));alpha=smooth(0,.3,r);break;
      case 'scroll':dy=(1-eOutQuint(r))*760;alpha=smooth(0,.25,r);break;
      case 'zoom':sm=lerp(2.6,1,eOutQuint(r));alpha=smooth(0,.35,r);break;
      default:alpha=smooth(0,1,r);}
    if(c.rollIn)rot+=(1-eOutCubic(r))*c.rollIn*Math.PI/180;
  }else if(t>c.t2s){const r=(t-c.t2s)/Math.max(c.outDur,1e-4);
    switch(c.out){
      case 'up':dy=-eInCubic(r)*160;alpha=1-smooth(.1,1,r);break;
      case 'down':dy=eInCubic(r)*160;alpha=1-smooth(.1,1,r);break;
      case 'scrollOut':dy=-eInCubic(r)*1100;alpha=1-smooth(.5,1,r);break;
      case 'smear':sm=lerp(1,1.35,eInCubic(r));alpha=1-smooth(0,1,r);break;
      case 'hold':break;
      default:alpha=1-smooth(0,1,r);}
  }
  if(t>=c.t1&&t<=c.t2s){dy+=2.2*drift(t,0.9,(c.x||0)*0.01+c.t0);dx+=1.6*drift(t,0.7,(c.y||0)*0.01);}
  return {x:p.x+dx*p.s,y:p.y+dy*p.s,s:p.s*sm,rot,vs,alpha,mask};
}
function withMB(stateFn,drawFn,t,maxTaps,div){
  const st=stateFn(t);if(!st||st.alpha<=0.003)return;
  const pv=stateFn(t-1/FPS);let taps=1;
  if(pv){const sp=Math.hypot(st.x-pv.x,st.y-pv.y)+Math.abs(st.s-pv.s)*300;taps=clamp(Math.round(sp/(div||13)),1,maxTaps||8);}
  if(taps===1){drawFn(st,1,true);return;}
  for(let k=taps-1;k>=0;k--){const s2=stateFn(t-(k/taps)/FPS);if(!s2)continue;
    drawFn(s2,((taps-k)/taps)/(k===0?1:1.7),k===0);}
}
function drawCue(c,t){
  withMB(tt=>cueState(c,tt),(st,a,main)=>{
    drawText(c.text,st.x,st.y,{font:c.font,size:c.size,ls:c.ls,color:c.color,s:st.s,rot:st.rot,vs:st.vs,
      alpha:st.alpha*a,mask:main?st.mask:null,shadow:main});
  },t);
}

/* ===========================================================================
   UI-примитивы Telegram (монохром)
   =========================================================================== */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function bubblePath(w,h,tail){const r=Math.min(30,h/2);ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,r);
  if(tail){ctx.moveTo(-w/2+4,h/2-24);ctx.quadraticCurveTo(-w/2-4,h/2-2,-w/2-20,h/2);ctx.quadraticCurveTo(-w/2+6,h/2+2,-w/2+22,h/2-6);}}
const AVATAR=new Image();AVATAR.src='avatar.jpg';
function drawAvatar(r){ // аватар канала (как в Telegram — круг)
  ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.clip();
  if(AVATAR.complete&&AVATAR.naturalWidth)ctx.drawImage(AVATAR,-r,-r,r*2,r*2);else{ctx.fillStyle='#333';ctx.fill();}
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=Math.max(1.5,r*0.03);ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke();
}
function drawCheck(x,y,s,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(x-s*0.5,y);ctx.lineTo(x-s*0.12,y+s*0.38);ctx.lineTo(x+s*0.55,y-s*0.42);ctx.stroke();}
function ripple(x,y,p,maxR){if(p<=0||p>=1)return;ctx.save();ctx.globalAlpha=0.7*(1-p);ctx.strokeStyle=BONE;
  ctx.lineWidth=5*(1-p)+1;ctx.beginPath();ctx.arc(x,y,maxR*eOutCubic(p),0,7);ctx.stroke();
  ctx.globalAlpha=0.18*(1-p);ctx.fillStyle=BONE;ctx.beginPath();ctx.arc(x,y,maxR*0.55*eOutCubic(p),0,7);ctx.fill();ctx.restore();}
function fmt(n){return String(Math.max(0,Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function drawDigits(str,x,y,size,font,color,alpha){
  setFont(font,0);const dw=ctx.measureText('0').width,sw=dw*0.4;
  let total=0;for(const ch of str)total+=ch===' '?sw:dw;
  let px=x-total/2;ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.textBaseline='middle';ctx.textAlign='center';
  for(const ch of str){const cw=ch===' '?sw:dw;if(ch!==' ')ctx.fillText(ch,px+cw/2,y);px+=cw;}ctx.restore();
  return total;
}
function digitsW(str,font){setFont(font,0);const dw=ctx.measureText('0').width;let w=0;for(const ch of str)w+=ch===' '?dw*0.4:dw;return w;}

/* ===========================================================================
   S1 · Уведомление (0–2.5)
   =========================================================================== */
function bannerState(t){
  if(t<0.22||t>2.5)return null;
  let y,s=1,alpha=1;
  if(t<0.6){const r=(t-0.22)/0.38;y=lerp(-780,-300,eOutBack(r));alpha=smooth(0,.3,r);}
  else if(t<1.25){y=-300;}
  else if(t<2.25){const r=(t-1.25)/1.0;y=lerp(-300,-20,eInOut(r));s=lerp(1,1.5,eInOut(r));}
  else{const r=(t-2.25)/0.25;y=lerp(-20,-1500,eInCubic(r));s=1.5;alpha=1-smooth(.5,1,r);}
  const cam=cameraAt(t),p=project(0,y,0,cam);
  return {x:p.x,y:p.y,s:p.s*s,alpha,rot:cam.roll};
}
function drawBanner(t){
  withMB(bannerState,(st,a)=>{
    const w=1000,h=176;ctx.save();ctx.globalAlpha=st.alpha*a;ctx.translate(st.x,st.y);ctx.rotate(st.rot);ctx.scale(st.s,st.s);
    ctx.shadowColor='rgba(0,0,0,0.55)';ctx.shadowBlur=50;ctx.shadowOffsetY=18;
    rr(-w/2,-h/2,w,h,36);ctx.fillStyle='rgba(32,36,46,0.96)';ctx.fill();ctx.shadowColor='transparent';
    ctx.strokeStyle=UI_B;ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.translate(-w/2+98,0);drawAvatar(60);ctx.restore();
    setFont(FONT.ui(44,600),0);ctx.fillStyle=BONE;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText('Memento Mori',-w/2+184,-28);
    setFont(FONT.ui(36,400),0);ctx.fillStyle=ASH;ctx.fillText('1 новое сообщение',-w/2+184,28);
    setFont(FONT.mono(26),0);ctx.fillStyle=ASH_D;ctx.textAlign='right';ctx.fillText('сейчас',w/2-40,-28);
    ctx.restore();
  },t);
}

/* ===========================================================================
   S2 · пузырь «это сообщение.»
   =========================================================================== */
function msgBubbleState(t){
  if(t<3.55||t>4.9)return null;
  let s=1,alpha=1,dy=0;
  if(t<3.95){const r=(t-3.55)/0.4;s=lerp(.15,1,eOutBack(r));alpha=smooth(0,.3,r);}
  else if(t>4.6){const r=(t-4.6)/0.3;s=lerp(1,.2,eInCubic(r));alpha=1-smooth(.4,1,r);dy=-r*40;}
  const cam=cameraAt(t),p=project(0,130+dy,0,cam);
  return {x:p.x,y:p.y,s:p.s*s,alpha,rot:cam.roll-0.02};
}
function drawMsgBubble(t){
  withMB(msgBubbleState,(st,a)=>{
    const w=800,h=180;ctx.save();ctx.globalAlpha=st.alpha*a;ctx.translate(st.x,st.y);ctx.rotate(st.rot);ctx.scale(st.s,st.s);
    ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=40;ctx.shadowOffsetY=14;
    bubblePath(w,h,true);ctx.fillStyle=UI;ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle=UI_B;ctx.lineWidth=2;ctx.stroke();
    setFont(FONT.serif(104),0);ctx.fillStyle=BONE;ctx.textBaseline='middle';ctx.textAlign='center';ctx.fillText('это сообщение.',-14,-4);
    setFont(FONT.mono(22),0);ctx.fillStyle=ASH_D;ctx.textAlign='right';ctx.fillText('00:00',w/2-26,h/2-24);
    ctx.restore();
  },t);
}

/* ===========================================================================
   S3 · бейдж-одометр 30 000
   =========================================================================== */
function badgeState(t){
  if(t<5.25||t>8.6)return null;
  let s=1,alpha=1;
  if(t<5.6){const r=(t-5.25)/0.35;s=lerp(.3,1,eOutBack(r));alpha=smooth(0,.3,r);}
  else if(t>8.3){const r=(t-8.3)/0.3;s=lerp(1,.6,eInCubic(r));alpha=1-smooth(0,1,r);}
  const cam=cameraAt(t),p=project(0,10,0,cam);
  return {x:p.x,y:p.y,s:p.s*s,alpha,rot:cam.roll};
}
function counterValue(t){if(t<5.4)return 0;const r=clamp((t-5.4)/0.6,0,1);
  return r>=1?30000:Math.round(30000*eOutCubic(r)/7)*7;}
function drawBadge(t){
  withMB(badgeState,(st,a)=>{
    const str=fmt(counterValue(t)),size=290,f=FONT.cond(size,700);
    ctx.save();ctx.globalAlpha=st.alpha*a;ctx.translate(st.x,st.y);ctx.rotate(st.rot);ctx.scale(st.s,st.s);
    const w=digitsW('30 000',f)+200,h=340;
    ctx.shadowColor='rgba(0,0,0,0.55)';ctx.shadowBlur=60;ctx.shadowOffsetY=20;
    rr(-w/2,-h/2,w,h,h/2);ctx.fillStyle='#232834';ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle='rgba(255,255,255,0.09)';ctx.lineWidth=3;ctx.stroke();
    if(t>5.4&&t<6.0){ctx.save();ctx.globalAlpha*=0.35;drawDigits(fmt(counterValue(t-0.02)),0,-28,size,f,BONE,1);ctx.restore();}
    drawDigits(str,0,8,size,f,BONE,1);
    setFont(FONT.mono(26),4);ctx.fillStyle=ASH;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('непрочитанных',0,h/2+40);
    ctx.restore();
  },t);
}

/* ===========================================================================
   S4 · ТУННЕЛЬ сообщений (9.6–16.35): пузыри летят на камеру по спирали
   =========================================================================== */
const FEED_TXT=['понедельник','работа','потом','вторник','созвон в 10:00','завтра','некогда','среда','на выходных',
 'потом','четверг','дедлайн','в следующем году','пятница','устал','потом','суббота','как-нибудь','воскресенье',
 'потом','понедельник','опять работа','когда будет время','вторник','потом','после отпуска','среда','не сейчас',
 'четверг','потом','летом','пятница','потом','с понедельника','суббота','потом','в другой раз','воскресенье'];
let TUN=[];
function buildTunnel(){const rng=mulberry32(4242);TUN=[];
  for(let i=0;i<380;i++){const hh=String(7+Math.floor(rng()*15)).padStart(2,'0'),mm=String(Math.floor(rng()*60)).padStart(2,'0');
    TUN.push({txt:FEED_TXT[i%FEED_TXT.length],time:hh+':'+mm,th:i*2.39996+rng()*0.3,z:i*92+rng()*30,rad:640+rng()*240,w:0});}}
const travel=t=>{const k=t-9.6;return 700*k+62*k*k*k;};
const spin=t=>{const k=t-9.6;return 0.22*k+0.018*k*k*k;};
function feedValue(t){const k=clamp(t-9.6,0,7.2);return 29993-Math.round(3*k*k*k*k+300*k);}
function overlayPresence(t){let m=0;for(const c of CUES)if(c.over){const st=cueState(c,t);if(st)m=Math.max(m,st.alpha);}return m;}
const tunnelFade=t=>smooth(9.55,9.95,t)*(1-smooth(15.9,16.35,t));
function tunState(b,tt){

/* ===========================================================================
   Фон: пыль, виньет, зерно
   =========================================================================== */
let DUST=[];
function setup(){const rng=mulberry32(1337);DUST=[];
  for(let i=0;i<200;i++)DUST.push({x:(rng()*2-1)*1600,y:(rng()*2-1)*1000,z:250+rng()*2600,r:.6+rng()*2.2,ph:rng()*10,sp:4+rng()*10});
  buildTunnel();buildNoise();}
const dot=(()=>{const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d');
  const rg=g.createRadialGradient(16,16,0,16,16,16);rg.addColorStop(0,'#fff');rg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=rg;g.fillRect(0,0,32,32);return c;})();
function drawDust(t,cam){
  const w=warmth(t);ctx.save();ctx.globalCompositeOperation='lighter';
  for(const d of DUST){const rise=w>0.05?-1:1;const y=d.y+rise*((t*d.sp*(1+w*2))%2000)-rise*1000;
    const p=project(d.x,y,d.z,cam);if(p.s<=0)continue;
    const a=clamp(0.24-(d.z-250)/2600*0.2,0.02,0.24)*(0.6+0.4*Math.sin(t*0.8+d.ph));
    const r=d.r*p.s*3;ctx.globalAlpha=a*0.55;ctx.drawImage(dot,p.x-r,p.y-r,r*2,r*2);}
  ctx.restore();
}
function drawVignette(t){const w=warmth(t);
  const g=ctx.createRadialGradient(W/2,H*0.47,H*0.22,W/2,H*0.5,H*0.98);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(0.65,`rgba(${Math.round(lerp(5,20,w))},${Math.round(lerp(7,8,w))},${Math.round(lerp(14,8,w))},0.33)`);
  g.addColorStop(1,`rgba(${Math.round(lerp(2,10,w))},${Math.round(lerp(3,4,w))},${Math.round(lerp(7,4,w))},0.9)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
let noiseTiles=null;
function buildNoise(){noiseTiles=[];for(let n=0;n<4;n++){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  const img=g.createImageData(256,256);const rng=mulberry32(7+n);
  for(let i=0;i<img.data.length;i+=4){const v=128+(rng()*2-1)*70;img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=255;}
  g.putImageData(img,0,0);noiseTiles.push(c);}}
function drawGrain(t){const fr=Math.round(t*FPS),tile=noiseTiles[fr%4],rng=mulberry32(fr*2654435761);
  const ox=Math.floor(rng()*256),oy=Math.floor(rng()*256);
  ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=0.045;
  for(let y=-oy;y<H;y+=256)for(let x=-ox;x<W;x+=256)ctx.drawImage(tile,x,y);ctx.restore();}

/* ===========================================================================
   Кадр
   =========================================================================== */
function renderAt(t){
  t=clamp(t,0,TOTAL-1e-6);
  const cam=cameraAt(t);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=bgColor(t);ctx.fillRect(0,0,W,H);
  if(!(t>=16.8&&t<18.4))drawDust(t,cam);
  drawBanner(t);
  drawMsgBubble(t);
  drawBadge(t);
  drawTunnel(t);
  drawECG(t);
  drawUnknown(t);
  drawTodayBubble(t);
  drawPost(t);
  drawReactions(t);
  drawCard(t);
  for(const c of CUES)drawCue(c,t);
  drawLive(t);
  drawTwoTone(t,'повезти может ','сегодня.',-380,96,27.6,28.45,0.25);
  drawTwoTone(t,'не пролистай ','сегодня.',225,70,35.4,99,0);
  drawVignette(t);
  drawGrain(t);
}
window.__ready=false;window.__renderAt=renderAt;window.__TOTAL=TOTAL;window.__FPS=FPS;
(async()=>{try{
  const loads=['800 100px "Unbounded"','900 100px "Unbounded"','300 100px "Unbounded"','500 100px "Unbounded"',
    '700 100px "Oswald"','600 100px "Oswald"','300 100px "Onest"','400 100px "Onest"','500 100px "Onest"','600 100px "Onest"','700 100px "Onest"','800 100px "Onest"',
    'italic 600 100px "Cormorant"','500 40px "JetBrains Mono"','48px "Noto Color Emoji"'];
  for(const l of loads)await document.fonts.load(l,'АБВЖЯё💀🎁');
  await document.fonts.ready;
  if(!AVATAR.complete)await new Promise(r=>{AVATAR.onload=AVATAR.onerror=r;});}catch(e){}
  setup();renderAt(0);window.__ready=true;})();
</script>
