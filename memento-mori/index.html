<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Memento Mori · KAPUSTKA</title>
<style>html,body{margin:0;background:#000;overflow:hidden}#stage{display:block}</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>
/* ===========================================================================
   Memento Mori · KAPUSTKA — кинетическая типографика v2
   Идея: дни жизни = сообщения в Telegram. ~30 000 непрочитанных, мы их листаем.
   Один цвет — СЕГОДНЯ. Сетка 100 BPM (доля 0.6 c).
   renderAt(t) — чистая функция времени.
   =========================================================================== */
const W=1920,H=1080,FPS=60,B=0.6,TOTAL=32.4;
const cv=document.getElementById('stage');
const ctx=cv.getContext('2d',{alpha:false});

/* ---------- утилиты ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,p)=>a+(b-a)*p;
const smooth=(a,b,x)=>{const p=clamp((x-a)/(b-a),0,1);return p*p*(3-2*p);};
const eOutCubic=p=>1-Math.pow(1-p,3);
const eOutQuint=p=>1-Math.pow(1-p,5);
const eInCubic=p=>p*p*p;
const eInOut=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eOutBack=p=>{const c1=1.55,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
const drift=(t,f,ph)=>Math.sin(t*f+ph);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashF(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function kf(t,arr){for(let i=0;i<arr.length-1;i++){if(t<=arr[i+1][0]){const d=arr[i+1][0]-arr[i][0];const p=d<=0?1:clamp((t-arr[i][0])/d,0,1);return lerp(arr[i][1],arr[i+1][1],eInOut(p));}}return arr[arr.length-1][1];}

/* ---------- палитра / шрифты ---------- */
const BONE='#ece7df',ASH='#8b8780',ASH_D='#5a5751',UI='#1a1e27',UI_B='rgba(255,255,255,0.07)';
const FONT={
  black:s=>`900 ${s}px "Inter Display","Inter",sans-serif`,
  bold:s=>`700 ${s}px "Inter Display","Inter",sans-serif`,
  semi:s=>`600 ${s}px "Inter","Inter Display",sans-serif`,
  reg:s=>`400 ${s}px "Inter","Inter Display",sans-serif`,
  med:s=>`500 ${s}px "Inter","Inter Display",sans-serif`,
  light:s=>`300 ${s}px "Inter Display","Inter",sans-serif`,
  serif:s=>`italic 500 ${s}px "DejaVu Serif","Liberation Serif",serif`,
  mono:s=>`500 ${s}px "JetBrains Mono","DejaVu Sans Mono",monospace`,
};
const warmth=t=>smooth(19.2,20.4,t)*0.85;
function bgColor(t){const w=warmth(t),c=[10,12,17],h=[21,15,11];
  return `rgb(${Math.round(lerp(c[0],h[0],w))},${Math.round(lerp(c[1],h[1],w))},${Math.round(lerp(c[2],h[2],w))})`;}

/* ===========================================================================
   Камера (псевдо-3D)
   =========================================================================== */
const F=1000;
function cameraAt(t){
  const cz=kf(t,[[0,-1150],[2.4,-1000],[9.6,-1040],[16.8,-860],[16.81,-1000],[19.2,-1000],[19.6,-955],[21.6,-1000],[28.8,-1030],[32.4,-985]]);
  let roll=kf(t,[[0,0],[5.3,0],[5.45,-0.9],[6.2,0],[9.6,0],[14.35,1.2],[14.5,-1.6],[15.4,1.8],[16.79,3.2],[16.81,0],[19.2,0],[19.3,0.9],[20.2,0],[23.9,0],[24.05,-0.7],[24.8,0],[32.4,0]]);
  roll+=0.22*drift(t,0.31,0.6);
  const scrollOrbit=smooth(9.6,10.6,t)*(1-smooth(16.75,16.81,t));
  const cx=20*drift(t,0.41,0.3)+14*drift(t,0.19,2.2)+90*scrollOrbit*Math.sin((t-9.6)*0.55);
  const cy=10*drift(t,0.33,1.1)+kf(t,[[0,0],[9.6,0],[16.8,-40],[16.81,0],[32.4,0]]);
  return {cx,cy,cz,roll:roll*Math.PI/180};
}
function project(x,y,z,cam){const dz=z-cam.cz,s=F/dz;return {x:W/2+(x-cam.cx)*s,y:H/2+(y-cam.cy)*s,s};}

/* ===========================================================================
   Текст
   =========================================================================== */
function setFont(font,ls){ctx.font=font;ctx.letterSpacing=(ls||0)+'px';}
function textW(text,font,ls){setFont(font,ls);return ctx.measureText(text).width-(ls||0);}
function liveGradient(size){const g=ctx.createLinearGradient(0,-size*0.55,0,size*0.55);
  g.addColorStop(0,'#ffe6ad');g.addColorStop(0.5,'#ffad3d');g.addColorStop(1,'#ff6b17');return g;}
// базовая отрисовка слова в экранных координатах (с маской/свечением/CA)
function drawText(text,sx,sy,o){
  const alpha=o.alpha==null?1:o.alpha;if(alpha<=0.003)return;
  const size=o.size,ls=o.ls||0;
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(sx,sy);
  if(o.rot)ctx.rotate(o.rot);
  ctx.scale(o.s||1,(o.s||1)*(o.vs||1));
  setFont(o.font,ls);ctx.textBaseline='middle';ctx.textAlign='left';
  const w=ctx.measureText(text).width-ls;
  const x0=o.align==='left'?0:-w/2;
  if(o.mask){ // маска: текст выезжает из-под линии
    const m=o.mask,pad=size*0.2;
    ctx.beginPath();
    if(m.type==='up')ctx.rect(x0-pad,-size*0.68,w+pad*2,size*1.36);
    else ctx.rect(x0-pad,-size,(w+pad*2)*clamp(m.p,0,1),size*2);
    ctx.clip();
  }
  const dy=o.mask&&o.mask.type==='up'?(1-eOutQuint(clamp(o.mask.p,0,1)))*size*1.15:0;
  if(o.color==='live'){
    const glow=o.glow||0;
    if(glow>0){ctx.save();ctx.globalCompositeOperation='lighter';
      ctx.shadowColor=`rgba(255,150,50,${0.9*glow})`;ctx.shadowBlur=size*0.22*glow;
      ctx.fillStyle=`rgba(255,150,50,${0.32*glow})`;ctx.fillText(text,x0,dy);
      ctx.shadowBlur=size*0.5*glow;ctx.fillStyle=`rgba(255,105,25,${0.2*glow})`;ctx.fillText(text,x0,dy);
      ctx.restore();}
    if(o.ca>0){ctx.save();ctx.globalCompositeOperation='lighter';
      ctx.fillStyle='rgba(255,45,45,0.5)';ctx.fillText(text,x0-o.ca,dy);
      ctx.fillStyle='rgba(45,125,255,0.45)';ctx.fillText(text,x0+o.ca,dy);ctx.restore();}
    ctx.shadowColor='rgba(0,0,0,0.4)';ctx.shadowBlur=size*0.03;ctx.shadowOffsetY=size*0.015;
    ctx.fillStyle=liveGradient(size);ctx.fillText(text,x0,dy);
  }else{
    if(o.shadow!==false){ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=size*0.06;ctx.shadowOffsetY=size*0.02;}
    ctx.fillStyle=o.color||BONE;ctx.fillText(text,x0,dy);
  }
  ctx.restore();
}

/* ===========================================================================
   Cue-система для слов. Все состояния — чистые функции t (для motion blur).
   in:  maskUp | mask | slide | scale | scaleBack | rise | scroll | fade | fall
   out: fade | up | down | shrink | scrollOut | smear | hold
   =========================================================================== */
function C(o){o.z=o.z||0;o.inDur=o.inDur??.4;o.hold=o.hold??.6;o.outDur=o.outDur??.35;
  o.t1=o.t0+o.inDur;o.t2s=o.t1+o.hold;o.t2=o.t2s+o.outDur;o.rot=o.rot||0;return o;}
function cueState(c,t){
  if(t<c.t0||t>c.t2)return null;
  const cam=cameraAt(t),p=project(c.x||0,c.y||0,c.z,cam);
  let dx=0,dy=0,sm=1,rot=cam.roll+c.rot*Math.PI/180,vs=1,alpha=1,mask=null;
  if(t<c.t1){const r=(t-c.t0)/c.inDur;
    switch(c.in){
      case 'maskUp':mask={type:'up',p:r};break;
      case 'mask':mask={type:'lr',p:eInOut(r)};break;
      case 'slide':dx=(1-eOutQuint(r))*(c.sdx||-260);alpha=smooth(0,.45,r);break;
      case 'scale':sm=lerp(.2,1,eOutCubic(r));alpha=smooth(0,.45,r);break;
      case 'scaleBack':sm=lerp(.15,1,eOutBack(r));alpha=smooth(0,.3,r);break;
      case 'rise':dy=(1-eOutCubic(r))*150;alpha=smooth(0,.5,r);break;
      case 'scroll':dy=(1-eOutQuint(r))*760;alpha=smooth(0,.25,r);break;
      case 'fall':dy=-(1-eOutCubic(r))*620;vs=lerp(1.25,1,eOutQuint(r));alpha=smooth(0,.35,r);break;
      default:alpha=smooth(0,1,r);}
    if(c.rollIn)rot+=(1-eOutCubic(r))*c.rollIn*Math.PI/180;
  }else if(t>c.t2s){const r=(t-c.t2s)/Math.max(c.outDur,1e-4);
    switch(c.out){
      case 'up':dy=-eInCubic(r)*160;alpha=1-smooth(.1,1,r);break;
      case 'down':dy=eInCubic(r)*160;alpha=1-smooth(.1,1,r);break;
      case 'shrink':sm=lerp(1,.75,eInOut(r));alpha=1-smooth(0,1,r);break;
      case 'scrollOut':dy=-eInCubic(r)*1100;alpha=1-smooth(.5,1,r);break;
      case 'smear':sm=lerp(1,1.35,eInCubic(r));alpha=1-smooth(0,1,r);break;
      case 'hold':break;
      default:alpha=1-smooth(0,1,r);}
  }
  if(t>=c.t1&&t<=c.t2s){dy+=2.2*drift(t,0.9,(c.x||0)*0.01+c.t0);dx+=1.6*drift(t,0.7,(c.y||0)*0.01);}
  return {x:p.x+dx*p.s,y:p.y+dy*p.s,s:p.s*sm*(c.scaleK||1),rot,vs,alpha:alpha*(c.alphaK||1),mask};
}
// универсальный motion blur: сэмплируем состояние в прошлых долях кадра
function withMB(stateFn,drawFn,t,maxTaps,div){
  const st=stateFn(t);if(!st||st.alpha<=0.003)return;
  const pv=stateFn(t-1/FPS);let taps=1;
  if(pv){const sp=Math.hypot(st.x-pv.x,st.y-pv.y)+Math.abs(st.s-pv.s)*300;taps=clamp(Math.round(sp/(div||13)),1,maxTaps||8);}
  if(taps===1){drawFn(st,1,true);return;}
  for(let k=taps-1;k>=0;k--){const s2=stateFn(t-(k/taps)/FPS);if(!s2)continue;
    drawFn(s2,((taps-k)/taps)/(k===0?1:1.7),k===0);}
}
function drawCue(c,t,dim){
  withMB(tt=>cueState(c,tt),(st,a,main)=>{
    drawText(c.text,st.x,st.y,{font:c.font,size:c.size,ls:c.ls,color:c.color,s:st.s,rot:st.rot,vs:st.vs,
      alpha:st.alpha*a*(dim||1),mask:main?st.mask:null,shadow:main});
  },t);
}

/* ===========================================================================
   UI-примитивы Telegram (монохром)
   =========================================================================== */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function bubblePath(w,h,tail){const r=Math.min(30,h/2);ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,r);
  if(tail){ctx.moveTo(-w/2+4,h/2-24);ctx.quadraticCurveTo(-w/2-4,h/2-2,-w/2-20,h/2);ctx.quadraticCurveTo(-w/2+6,h/2+2,-w/2+22,h/2-6);}}
function drawCabbage(r,alpha){ // аватар канала: кочан
  ctx.save();ctx.globalAlpha*=alpha;
  const g=ctx.createRadialGradient(-r*0.3,-r*0.35,r*0.1,0,0,r);g.addColorStop(0,'#f4f0e8');g.addColorStop(1,'#cfc8bb');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.strokeStyle='#14171d';ctx.lineWidth=r*0.075;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,r*0.78);ctx.quadraticCurveTo(-r*0.1,0,r*0.05,-r*0.62);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-r*0.05,r*0.7);ctx.quadraticCurveTo(-r*0.75,r*0.35,-r*0.55,-r*0.45);ctx.stroke();
  ctx.beginPath();ctx.moveTo(r*0.05,r*0.7);ctx.quadraticCurveTo(r*0.75,r*0.35,r*0.55,-r*0.45);ctx.stroke();
  ctx.lineWidth=r*0.05;
  ctx.beginPath();ctx.moveTo(-r*0.3,r*0.3);ctx.quadraticCurveTo(-r*0.45,-r*0.1,-r*0.25,-r*0.35);ctx.stroke();
  ctx.beginPath();ctx.moveTo(r*0.3,r*0.3);ctx.quadraticCurveTo(r*0.45,-r*0.1,r*0.25,-r*0.35);ctx.stroke();
  ctx.restore();
}
function drawCheck(x,y,s,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(x-s*0.5,y);ctx.lineTo(x-s*0.12,y+s*0.38);ctx.lineTo(x+s*0.55,y-s*0.42);ctx.stroke();}
function ripple(x,y,p,maxR){if(p<=0||p>=1)return;ctx.save();ctx.globalAlpha=0.7*(1-p);ctx.strokeStyle=BONE;
  ctx.lineWidth=5*(1-p)+1;ctx.beginPath();ctx.arc(x,y,maxR*eOutCubic(p),0,7);ctx.stroke();
  ctx.globalAlpha=0.18*(1-p);ctx.fillStyle=BONE;ctx.beginPath();ctx.arc(x,y,maxR*0.55*eOutCubic(p),0,7);ctx.fill();ctx.restore();}
function fmt(n){return String(Math.max(0,Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
// число с фиксированной шириной цифр (одометр без «дрожания»)
function drawDigits(str,x,y,size,font,color,alpha){
  setFont(font,0);const dw=ctx.measureText('0').width,sw=dw*0.4;
  let total=0;for(const ch of str)total+=ch===' '?sw:dw;
  let px=x-total/2;ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.textBaseline='middle';ctx.textAlign='center';
  for(const ch of str){const cw=ch===' '?sw:dw;if(ch!==' ')ctx.fillText(ch,px+cw/2,y);px+=cw;}ctx.restore();
  return total;
}

/* ===========================================================================
   S1 · Уведомление (0–2.45)
   =========================================================================== */
function bannerState(t){
  if(t<0.22||t>2.5)return null;
  let y,s=1,alpha=1;
  if(t<0.6){const r=(t-0.22)/0.38;y=lerp(-780,-300,eOutBack(r));alpha=smooth(0,.3,r);}
  else if(t<1.25){y=-300;}
  else if(t<2.25){const r=(t-1.25)/1.0;y=lerp(-300,-20,eInOut(r));s=lerp(1,1.5,eInOut(r));}
  else{const r=(t-2.25)/0.25;y=lerp(-20,-1500,eInCubic(r));s=1.5;alpha=1-smooth(.5,1,r);}
  const cam=cameraAt(t),p=project(0,y,0,cam);
  return {x:p.x,y:p.y,s:p.s*s,alpha,rot:cam.roll};
}
function drawBanner(t){
  withMB(bannerState,(st,a)=>{
    const w=1000,h=176;ctx.save();ctx.globalAlpha=st.alpha*a;ctx.translate(st.x,st.y);ctx.rotate(st.rot);ctx.scale(st.s,st.s);
    ctx.shadowColor='rgba(0,0,0,0.55)';ctx.shadowBlur=50;ctx.shadowOffsetY=18;
    rr(-w/2,-h/2,w,h,36);ctx.fillStyle='rgba(32,36,46,0.96)';ctx.fill();ctx.shadowColor='transparent';
    ctx.strokeStyle=UI_B;ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.translate(-w/2+98,0);drawCabbage(58,1);ctx.restore();
    setFont(FONT.semi(44),0);ctx.fillStyle=BONE;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText('Memento Mori',-w/2+184,-28);
    setFont(FONT.reg(36),0);ctx.fillStyle=ASH;ctx.fillText('1 новое сообщение',-w/2+184,28);
    setFont(FONT.mono(26),0);ctx.fillStyle=ASH_D;ctx.textAlign='right';ctx.fillText('сейчас',w/2-40,-28);
    ctx.restore();
  },t);
}

/* ===========================================================================
   S2 · пузырь «это сообщение.» (3.6–4.85)
   =========================================================================== */
function msgBubbleState(t){
  if(t<3.55||t>4.9)return null;
  let s=1,alpha=1,dy=0;
  if(t<3.95){const r=(t-3.55)/0.4;s=lerp(.15,1,eOutBack(r));alpha=smooth(0,.3,r);}
  else if(t>4.6){const r=(t-4.6)/0.3;s=lerp(1,.2,eInCubic(r));alpha=1-smooth(.4,1,r);dy=-r*40;}
  const cam=cameraAt(t),p=project(0,120+dy,0,cam);
  return {x:p.x,y:p.y,s:p.s*s,alpha,rot:cam.roll-0.02};
}
function drawMsgBubble(t){
  withMB(msgBubbleState,(st,a,main)=>{
    const w=760,h=170;ctx.save();ctx.globalAlpha=st.alpha*a;ctx.translate(st.x,st.y);ctx.rotate(st.rot);ctx.scale(st.s,st.s);
    ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=40;ctx.shadowOffsetY=14;
    bubblePath(w,h,true);ctx.fillStyle=UI;ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle=UI_B;ctx.lineWidth=2;ctx.stroke();
    setFont(FONT.serif(86),0);ctx.fillStyle=BONE;ctx.textBaseline='middle';ctx.textAlign='center';ctx.fillText('это сообщение.',-14,-6);
    setFont(FONT.mono(22),0);ctx.fillStyle=ASH_D;ctx.textAlign='right';ctx.fillText('00:00',w/2-26,h/2-24);
    ctx.restore();
  },t);
}

/* ===========================================================================
   S3 · бейдж-одометр 30 000 (5.3–8.55)
   =========================================================================== */
function badgeState(t){
  if(t<5.25||t>8.6)return null;
  let s=1,alpha=1;
  if(t<5.6){const r=(t-5.25)/0.35;s=lerp(.3,1,eOutBack(r));alpha=smooth(0,.3,r);}
  else if(t>8.3){const r=(t-8.3)/0.3;s=lerp(1,.6,eInCubic(r));alpha=1-smooth(0,1,r);}
  const cam=cameraAt(t),p=project(0,10,0,cam);
  return {x:p.x,y:p.y,s:p.s*s,alpha,rot:cam.roll};
}
function counterValue(t){if(t<5.4)return 0;const r=clamp((t-5.4)/0.6,0,1);
  return r>=1?30000:Math.round(30000*eOutCubic(r)/7)*7;}
function drawBadge(t){
  withMB(badgeState,(st,a)=>{
    const str=fmt(counterValue(t));const size=250;
    ctx.save();ctx.globalAlpha=st.alpha*a;ctx.translate(st.x,st.y);ctx.rotate(st.rot);ctx.scale(st.s,st.s);
    setFont(FONT.black(size),0);const dw=ctx.measureText('0').width;const w=dw*5+dw*0.4+170,h=330;
    ctx.shadowColor='rgba(0,0,0,0.55)';ctx.shadowBlur=60;ctx.shadowOffsetY=20;
    rr(-w/2,-h/2,w,h,h/2);ctx.fillStyle='#232834';ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle='rgba(255,255,255,0.09)';ctx.lineWidth=3;ctx.stroke();
    // одометр: при быстром счёте лёгкий вертикальный смаз цифр
    const rolling=t>5.4&&t<6.0;
    if(rolling){ctx.save();ctx.globalAlpha*=0.35;drawDigits(fmt(counterValue(t-0.02)),0,-26,size,FONT.black(size),BONE,1);ctx.restore();}
    drawDigits(str,0,6,size,FONT.black(size),BONE,1);
    setFont(FONT.mono(26),4);ctx.fillStyle=ASH;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('непрочитанных',0,h/2+44);
    ctx.restore();
  },t);
}

/* ===========================================================================
   S4 · лента на наклонной плоскости (9.6–16.8)
   =========================================================================== */
const FEED_TXT=['понедельник','работа','потом','вторник','созвон в 10:00','завтра','некогда','среда','на выходных',
 'потом','четверг','дедлайн','в следующем году','пятница','устал','потом','суббота','как-нибудь','воскресенье',
 'потом','понедельник','опять работа','когда будет время','вторник','потом','после отпуска','среда','не сейчас',
 'четверг','потом','летом','пятница','потом','с понедельника','суббота','потом','в другой раз','воскресенье'];
let FEED=[];
function buildFeed(){
  const rng=mulberry32(4242);FEED=[];
  for(let i=0;i<130;i++){const txt=FEED_TXT[i%FEED_TXT.length];
    const hh=String(7+Math.floor(rng()*15)).padStart(2,'0'),mm=String(Math.floor(rng()*60)).padStart(2,'0');
    FEED.push({txt,time:hh+':'+mm,x:(i%2?1:-1)*(150+rng()*190),u:i*190,w:0});}
}
const TILT=55*Math.PI/180;
function scrollPos(t){const k=t-9.6;return 330*k+48*k*k*k;}
function feedValue(t){const k=clamp(t-9.6,0,7.2);return 29993-Math.round(3*k*k*k*k+300*k);}
function overlayPresence(t){let m=0;for(const c of CUES)if(c.over){const st=cueState(c,t);if(st)m=Math.max(m,st.alpha);}return m;}
function drawFeed(t){
  if(t<9.55||t>=16.8)return;
  const cam=cameraAt(t),fade=smooth(9.55,9.95,t),dim=1-0.55*overlayPresence(t);
  const items=[];
  for(const b of FEED){
    const v=b.u-scrollPos(t)-420;
    if(v<-560||v>2700)continue;
    const y=60-v*Math.cos(TILT),z=v*Math.sin(TILT);
    items.push({b,v,z,y});
  }
  items.sort((a,b)=>b.z-a.z);
  setFont(FONT.med(40),0);
  for(const it of items){
    const {b,v}=it;
    if(!b.w){setFont(FONT.med(54),0);b.w=ctx.measureText(b.txt).width+124;}
    const st=tt=>{const vv=b.u-scrollPos(tt)-420;const cm=cameraAt(tt);
      const p=project(b.x,60-vv*Math.cos(TILT),vv*Math.sin(TILT),cm);
      const a=fade*dim*clamp(1-(vv-1700)/1000,0,1)*clamp((vv+560)/260,0,1);
      return {x:p.x,y:p.y,s:p.s,alpha:a,rot:cm.roll};};
    withMB(st,(s,a)=>{
      ctx.save();ctx.globalAlpha=s.alpha*a;ctx.translate(s.x,s.y);ctx.rotate(s.rot);ctx.scale(s.s,s.s*0.62);
      const w=b.w,h=128;bubblePath(w,h,true);ctx.fillStyle=UI;ctx.fill();ctx.strokeStyle=UI_B;ctx.lineWidth=2;ctx.stroke();
      setFont(FONT.med(54),0);ctx.fillStyle='#d9d4cc';ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(b.txt,-w/2+46,-8);
      setFont(FONT.mono(24),0);ctx.fillStyle=ASH_D;ctx.textAlign='right';ctx.fillText(b.time,w/2-24,h/2-26);
      ctx.restore();
    },t,14,7);
  }
  // HUD: бейдж непрочитанных — тает
  const ha=smooth(9.7,10.2,t);
  if(ha>0){const val=feedValue(t);const str=t>16.35?glitch(t):fmt(val);
    ctx.save();ctx.globalAlpha=ha;const x=W-250,y=118;
    setFont(FONT.bold(44),0);const dw=ctx.measureText('0').width;const w=dw*6+50;
    rr(x-w/2,y-38,w,76,38);ctx.fillStyle='#232834';ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=2;ctx.stroke();
    drawDigits(str,x,y+2,44,FONT.bold(44),BONE,1);
    setFont(FONT.mono(20),3);ctx.fillStyle=ASH;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('непрочитанных',x,y+66);
    ctx.restore();}
}
function glitch(t){const fr=Math.round(t*FPS);const r=mulberry32(fr*977);const base=String(feedValue(Math.min(t,16.8))).padStart(5,'0');
  let s=base.slice(0,1+(fr%2));while(s.length<5)s+=Math.floor(r()*10);return s.slice(0,2)+' '+s.slice(2);}

/* ===========================================================================
   S5 · Обрыв: «?» и машинопись (16.8–18.4)
   =========================================================================== */
function drawUnknown(t){
  if(t<16.8||t>18.45)return;
  const cam=cameraAt(t);
  let s=1,a=1;
  if(t<16.95){s=lerp(.85,1,eOutBack((t-16.8)/0.15));}
  if(t>18.15){const r=(t-18.15)/0.3;a=1-smooth(0,1,r);s=lerp(1,.8,r);}
  const p=project(0,-60,0,cam);
  ctx.save();ctx.globalAlpha=a;ctx.translate(p.x,p.y);ctx.rotate(cam.roll);ctx.scale(p.s*s,p.s*s);
  const w=420,h=250;rr(-w/2,-h/2,w,h,h/2);ctx.fillStyle='#232834';ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.09)';ctx.lineWidth=3;ctx.stroke();
  const str=t<16.95?glitch(t):'?';
  if(str==='?'){const bl=0.75+0.25*Math.sin((t-16.95)*9);drawText('?',0,4,{font:FONT.black(190),size:190,color:BONE,alpha:bl,shadow:false});}
  else drawDigits(str,0,6,100,FONT.black(100),BONE,1);
  ctx.restore();
  // машинопись
  const line='сколько осталось — не видно.';
  const n=clamp(Math.floor((t-17.2)/0.032),0,line.length);
  if(n>0){const caret=(Math.floor(t*3)%2===0)?'▍':' ';
    const pp=project(0,180,0,cam);
    ctx.save();ctx.globalAlpha=a;ctx.translate(pp.x,pp.y);ctx.rotate(cam.roll);ctx.scale(pp.s,pp.s);
    setFont(FONT.mono(42),0);const full=ctx.measureText(line).width;
    ctx.fillStyle=ASH;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(line.slice(0,n)+(n<line.length?caret:''),-full/2,0);
    ctx.restore();}
}

/* ===========================================================================
   S6 · «сегодня» → тап → СЕГОДНЯ (18.45–25.85)
   =========================================================================== */
const TAP1=19.2;
function todayBubbleState(t){
  if(t<18.45||t>19.75)return null;
  let dy=0,s=1,alpha=1;
  if(t<18.95){const r=(t-18.45)/0.5;dy=(1-eOutQuint(r))*560;alpha=smooth(0,.35,r);}
  if(t>TAP1-0.06&&t<TAP1+0.08)s=0.95;
  const cam=cameraAt(t),p=project(0,40+dy,0,cam);
  return {x:p.x,y:p.y,s:p.s*s,alpha,rot:cam.roll};
}
function drawTodayBubble(t){
  withMB(todayBubbleState,(st,a)=>{
    let w=440,h=124,fillA=1,txtA=1;
    if(t>TAP1+0.05){const r=clamp((t-TAP1-0.05)/0.5,0,1);w=lerp(440,2600,eInCubic(r));h=lerp(124,1500,eInCubic(r));fillA=1-smooth(.45,1,r);txtA=1-smooth(0,.25,r);}
    ctx.save();ctx.globalAlpha=st.alpha*a;ctx.translate(st.x,st.y);ctx.rotate(st.rot);ctx.scale(st.s,st.s);
    ctx.globalAlpha=st.alpha*a*fillA;ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=40;ctx.shadowOffsetY=12;
    bubblePath(w,h,w<700);ctx.fillStyle=UI;ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle=UI_B;ctx.lineWidth=2;ctx.stroke();
    ctx.globalAlpha=st.alpha*a*txtA;setFont(FONT.med(56),0);ctx.fillStyle=BONE;ctx.textBaseline='middle';ctx.textAlign='center';ctx.fillText('сегодня',-10,-4);
    setFont(FONT.mono(22),0);ctx.fillStyle=ASH_D;ctx.textAlign='right';ctx.fillText('сейчас',w/2-24,h/2-22);
    ctx.globalAlpha=st.alpha*a*txtA*smooth(18.7,19.0,t);setFont(FONT.mono(26),3);ctx.fillStyle=ASH;ctx.textAlign='center';
    ctx.fillText('1 непрочитанное',0,-h/2-50);
    ctx.restore();
  },t);
  if(t>TAP1-0.02&&t<TAP1+0.6){const cam=cameraAt(t),p=project(20,40,0,cam);ripple(p.x,p.y,(t-TAP1+0.02)/0.55,230*p.s);}
}
function drawLive(t){
  const t0=TAP1+0.08,end=25.85;if(t<t0||t>end)return;
  const cam=cameraAt(t);let size=265,y=-10,sm=1,alpha=1,glow=1,ca=4;
  if(t<t0+0.45){const r=(t-t0)/0.45;sm=lerp(.16,1,eOutBack(r));alpha=smooth(0,.3,r);glow=lerp(2.4,1.1,r);ca=lerp(24,5,r);}
  else if(t<21.25){glow=1+0.12*Math.sin((t-t0)*3.3);sm=1+0.012*Math.sin((t-t0)*2.1);}
  else if(t<21.8){const r=(t-21.25)/0.55;size=lerp(265,150,eInOut(r));y=lerp(-10,-330,eInOut(r));glow=lerp(1,.75,r);ca=3;}
  else if(t<25.55){size=150;y=-330;glow=.75+0.06*Math.sin(t*2.2);ca=2.5;}
  else{const r=(t-25.55)/0.3;size=150;y=-330-r*120;alpha=1-smooth(0,1,r);glow=.7;ca=2;}
  const p=project(0,y,0,cam);
  const xx=p.x+2*drift(t,0.8,0.5)*p.s,yy=p.y+2.4*drift(t,0.9,2)*p.s;
  if(glow>0){ctx.save();ctx.globalCompositeOperation='lighter';
    const rg=ctx.createRadialGradient(xx,yy,0,xx,yy,size*2.2*p.s*sm);
    rg.addColorStop(0,`rgba(255,150,60,${0.2*glow*alpha})`);rg.addColorStop(0.45,`rgba(255,110,40,${0.08*glow*alpha})`);rg.addColorStop(1,'rgba(255,90,30,0)');
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);ctx.restore();}
  drawText('СЕГОДНЯ',xx,yy,{font:FONT.black(Math.round(size)),size,ls:size*0.02,color:'live',s:p.s*sm,rot:cam.roll,alpha,glow,ca});
  // ✓✓ прочитано
  if(t>19.62&&t<21.4){const r=clamp((t-19.62)/0.25,0,1),fa=1-smooth(21.1,21.4,t);
    const pp=project(470,215,0,cam);ctx.save();ctx.globalAlpha=fa*smooth(0,.4,r);ctx.translate(pp.x,pp.y);ctx.scale(pp.s*lerp(.6,1,eOutBack(r)),pp.s*lerp(.6,1,eOutBack(r)));
    ctx.shadowColor='rgba(255,140,40,0.8)';ctx.shadowBlur=16;
    drawCheck(-40,0,46,'#ffb04a',7);if(t>19.7)drawCheck(-12,0,46,'#ffb04a',7);
    ctx.shadowBlur=0;setFont(FONT.mono(30),2);ctx.fillStyle=ASH;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('прочитано',36,2);
    ctx.restore();}
}

/* ===========================================================================
   S8 · Карточка канала + «Подписаться» (25.8–28.9)
   =========================================================================== */
const TAP2=27.6;
function cardState(t){
  if(t<25.75||t>28.95)return null;
  let s=1,alpha=1,dy=0,vs=1;
  if(t<26.35){const r=(t-25.75)/0.6;s=lerp(.78,1,eOutCubic(r));dy=(1-eOutCubic(r))*240;vs=lerp(.55,1,eOutCubic(r));alpha=smooth(0,.4,r);}
  else if(t>28.6){const r=(t-28.6)/0.35;s=lerp(1,.86,eInCubic(r));dy=-eInCubic(r)*120;alpha=1-smooth(0,1,r);}
  const cam=cameraAt(t),p=project(0,10+dy,0,cam);
  return {x:p.x,y:p.y,s:p.s*s,vs,alpha,rot:cam.roll};
}
function drawCard(t){
  withMB(cardState,(st,a)=>{
    const w=980,h=660;ctx.save();ctx.globalAlpha=st.alpha*a;ctx.translate(st.x,st.y);ctx.rotate(st.rot);ctx.scale(st.s*1.22,st.s*1.22*st.vs);
    ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=80;ctx.shadowOffsetY=30;
    rr(-w/2,-h/2,w,h,48);ctx.fillStyle='#181c25';ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.translate(0,-170);drawCabbage(96,1);ctx.restore();
    setFont(FONT.black(84),0);ctx.fillStyle=BONE;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Memento Mori',0,-6);
    setFont(FONT.mono(30),3);ctx.fillStyle=ASH;ctx.fillText('Telegram-канал · KAPUSTKA',0,66);
    // кнопка
    const pressed=t>TAP2-0.05&&t<TAP2+0.08, done=t>=TAP2+0.06;
    const bw=600,bh=108,by=196;const bs=pressed?0.95:(t>27.0&&t<TAP2-0.05?1+0.025*Math.sin((t-27.0)*16):1);
    ctx.save();ctx.translate(0,by);ctx.scale(bs,bs);
    rr(-bw/2,-bh/2,bw,bh,bh/2);
    if(!done){ctx.fillStyle=BONE;ctx.fill();setFont(FONT.bold(40),6);ctx.fillStyle='#14171d';ctx.fillText('ПОДПИСАТЬСЯ',0,2);}
    else{const r=clamp((t-TAP2-0.06)/0.25,0,1);ctx.fillStyle=`rgba(236,231,223,${0.08+0.92*(1-r)})`;ctx.fill();
      ctx.strokeStyle='rgba(236,231,223,0.35)';ctx.lineWidth=3;ctx.stroke();
      setFont(FONT.bold(38),5);ctx.fillStyle=r<0.5?'#14171d':BONE;ctx.fillText('ВЫ ПОДПИСАНЫ',-24,2);
      const tw=ctx.measureText('ВЫ ПОДПИСАНЫ').width;ctx.globalAlpha*=smooth(.3,.8,r);drawCheck(tw/2+14,2,34,BONE,6);}
    ctx.restore();
    ctx.restore();
  },t);
  if(t>TAP2-0.02&&t<TAP2+0.6){const st=cardState(t);if(st)ripple(st.x+40*st.s*1.22,st.y+196*st.s*1.22,(t-TAP2+0.02)/0.55,300*st.s);}
}

/* ===========================================================================
   Слова (CUES)
   =========================================================================== */
const CUES=[
  // S2 метафора
  C({text:'КАЖДЫЙ ДЕНЬ —',x:0,y:-110,size:150,font:FONT.black(150),ls:3,t0:2.4,inDur:.42,hold:1.6,outDur:.35,in:'maskUp',out:'up'}),
  // S3 счёт
  C({text:'их примерно',x:0,y:-262,size:64,font:FONT.light(64),color:ASH,t0:4.8,inDur:.4,hold:2.95,outDur:.3,in:'slide',sdx:-240,out:'up'}),
  C({text:'на всю жизнь.',x:0,y:330,size:84,font:FONT.serif(84),color:BONE,t0:7.2,inDur:.45,hold:.65,outDur:.3,in:'maskUp',out:'down'}),
  C({text:'и мы их',x:-320,y:-170,size:92,font:FONT.light(92),t0:8.4,inDur:.35,hold:.75,outDur:.35,in:'slide',sdx:-260,out:'scrollOut'}),
  C({text:'ЛИСТАЕМ',x:60,y:40,size:260,font:FONT.black(260),ls:4,t0:9.0,inDur:.32,hold:.33,outDur:.3,in:'scroll',out:'scrollOut'}),
  // S4 поверх ленты (на долях)
  C({over:1,text:'не читая.',x:0,y:-30,size:190,font:FONT.black(190),t0:10.8,inDur:.38,hold:.58,outDur:.25,in:'maskUp',out:'up'}),
  C({over:1,text:'потом.',x:-430,y:-200,size:130,font:FONT.light(130),t0:12.0,inDur:.35,hold:.75,outDur:.3,in:'slide',sdx:-300,rot:-4,rollIn:-8,out:'fade'}),
  C({over:1,text:'потом.',x:390,y:170,size:190,font:FONT.black(190),t0:13.2,inDur:.32,hold:.75,outDur:.3,in:'slide',sdx:320,rot:5,rollIn:8,out:'fade'}),
  C({over:1,text:'ПОТОМ.',x:0,y:0,size:360,font:FONT.black(360),ls:4,t0:14.4,inDur:.3,hold:.9,outDur:.3,in:'scaleBack',rot:-3,rollIn:-7,out:'smear'}),
  // S7 смысл
  C({text:'memento mori —',x:0,y:-110,size:84,font:FONT.serif(84),color:ASH,t0:21.6,inDur:.45,hold:.95,outDur:.3,in:'maskUp',out:'up'}),
  C({text:'не про смерть.',x:0,y:40,size:150,font:FONT.light(150),t0:22.0,inDur:.45,hold:.55,outDur:.3,in:'maskUp',out:'up'}),
  C({text:'а про то, чтобы',x:0,y:-120,size:70,font:FONT.light(70),color:ASH,t0:23.1,inDur:.4,hold:2.1,outDur:.3,in:'maskUp',out:'up'}),
  C({text:'НЕ ПРОЛИСТАТЬ',x:0,y:30,size:165,font:FONT.black(165),ls:3,t0:23.4,inDur:.32,hold:1.9,outDur:.3,in:'scaleBack',out:'up'}),
  C({text:'жизнь.',x:0,y:210,size:130,font:FONT.serif(130),t0:24.0,inDur:.45,hold:1.3,outDur:.3,in:'maskUp',out:'up'}),
  // S9 подпись
  C({text:'MEMENTO MORI',x:0,y:-80,size:190,font:FONT.black(190),ls:6,t0:28.8,inDur:.5,hold:3.2,outDur:0,in:'maskUp',out:'hold'}),
  C({text:'KAPUSTKA',x:0,y:70,size:58,font:FONT.mono(58),ls:22,color:ASH,t0:29.4,inDur:.6,hold:2.4,outDur:0,in:'mask',out:'hold'}),
];
function drawFinalLine(t){ // «не пролистай сегодня.» — сегодня тем же цветом
  if(t<30.0)return;const r=clamp((t-30.0)/0.6,0,1);const cam=cameraAt(t);const p=project(0,200+(1-eOutCubic(r))*60,0,cam);
  const a=smooth(0,.7,r),size=58;const f1=FONT.serif(size);
  const w1=textW('не пролистай ',f1,0),w2=textW('сегодня.',f1,0);const x0=-(w1+w2)/2;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(cam.roll);ctx.scale(p.s,p.s);
  drawText('не пролистай ',x0,0,{font:f1,size,color:ASH,align:'left',alpha:a});
  drawText('сегодня.',x0+w1,0,{font:f1,size,color:'live',align:'left',alpha:a,glow:0.5});
  ctx.restore();
}

/* ===========================================================================
   Фон: пыль, виньет, зерно
   =========================================================================== */
let DUST=[];
function setup(){const rng=mulberry32(1337);DUST=[];
  for(let i=0;i<200;i++)DUST.push({x:(rng()*2-1)*1600,y:(rng()*2-1)*1000,z:250+rng()*2600,r:.6+rng()*2.2,ph:rng()*10,sp:4+rng()*10});
  buildFeed();buildNoise();}
const dot=(()=>{const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d');
  const rg=g.createRadialGradient(16,16,0,16,16,16);rg.addColorStop(0,'#fff');rg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=rg;g.fillRect(0,0,32,32);return c;})();
function drawDust(t,cam){
  const w=warmth(t);ctx.save();ctx.globalCompositeOperation='lighter';
  for(const d of DUST){const rise=w>0.05?-1:1;const y=d.y+rise*((t*d.sp*(1+w*2))%2000)-rise*1000;
    const p=project(d.x,y,d.z,cam);if(p.s<=0)continue;
    const a=clamp(0.24-(d.z-250)/2600*0.2,0.02,0.24)*(0.6+0.4*Math.sin(t*0.8+d.ph));
    const r=d.r*p.s*3;ctx.globalAlpha=a*0.55;ctx.drawImage(dot,p.x-r,p.y-r,r*2,r*2);}
  ctx.restore();
}
function drawVignette(t){const w=warmth(t);
  const g=ctx.createRadialGradient(W/2,H*0.47,H*0.22,W/2,H*0.5,H*0.98);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(0.65,`rgba(${Math.round(lerp(5,18,w))},${Math.round(lerp(7,11,w))},${Math.round(lerp(14,7,w))},0.33)`);
  g.addColorStop(1,`rgba(${Math.round(lerp(2,10,w))},${Math.round(lerp(3,6,w))},${Math.round(lerp(7,4,w))},0.9)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
let noiseTiles=null;
function buildNoise(){noiseTiles=[];for(let n=0;n<4;n++){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  const img=g.createImageData(256,256);const rng=mulberry32(7+n);
  for(let i=0;i<img.data.length;i+=4){const v=128+(rng()*2-1)*70;img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=255;}
  g.putImageData(img,0,0);noiseTiles.push(c);}}
function drawGrain(t){const fr=Math.round(t*FPS),tile=noiseTiles[fr%4],rng=mulberry32(fr*2654435761);
  const ox=Math.floor(rng()*256),oy=Math.floor(rng()*256);
  ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=0.045;
  for(let y=-oy;y<H;y+=256)for(let x=-ox;x<W;x+=256)ctx.drawImage(tile,x,y);ctx.restore();}

/* ===========================================================================
   Кадр
   =========================================================================== */
function renderAt(t){
  t=clamp(t,0,TOTAL-1e-6);
  const cam=cameraAt(t);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=bgColor(t);ctx.fillRect(0,0,W,H);
  // в момент обрыва — пыль тоже замирает и гаснет
  if(!(t>=16.8&&t<18.4))drawDust(t,cam);
  drawBanner(t);
  drawMsgBubble(t);
  drawBadge(t);
  drawFeed(t);
  drawUnknown(t);
  drawTodayBubble(t);
  drawCard(t);
  for(const c of CUES)drawCue(c,t);
  drawLive(t);
  drawFinalLine(t);
  drawVignette(t);
  drawGrain(t);
}
window.__ready=false;window.__renderAt=renderAt;window.__TOTAL=TOTAL;window.__FPS=FPS;
(async()=>{try{
  await document.fonts.load('900 200px "Inter Display"');await document.fonts.load('300 200px "Inter Display"');
  await document.fonts.load('700 200px "Inter Display"');await document.fonts.load('600 40px "Inter"');
  await document.fonts.load('400 40px "Inter"');await document.fonts.load('500 40px "Inter"');
  await document.fonts.load('italic 500 64px "DejaVu Serif"');await document.fonts.load('500 40px "JetBrains Mono"');
  await document.fonts.ready;}catch(e){}
  setup();renderAt(0);window.__ready=true;})();
</script>
